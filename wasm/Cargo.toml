[package]
name = "farfield_kernel"
version = "0.1.0"
edition = "2021"
description = "SIMD far-field array-factor kernel for PhasedArrayVisualizer"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wide = "0.7"
faer = { version = "0.24", default-features = false, features = ["std"] }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd"]
